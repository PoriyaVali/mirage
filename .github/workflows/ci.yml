name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: go vet ./...
      - run: go test -race -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64,            goos: linux,   goarch: amd64 }
          - { name: linux-arm64,            goos: linux,   goarch: arm64 }
          - { name: linux-armv7,            goos: linux,   goarch: arm,    goarm: '7' }
          - { name: linux-mipsle-softfloat, goos: linux,   goarch: mipsle, gomips: softfloat }
          - { name: linux-mips-softfloat,   goos: linux,   goarch: mips,   gomips: softfloat }
          - { name: windows-amd64,          goos: windows, goarch: amd64, ext: '.exe' }
          - { name: windows-arm64,          goos: windows, goarch: arm64, ext: '.exe' }
          - { name: darwin-amd64,           goos: darwin,  goarch: amd64 }
          - { name: darwin-arm64,           goos: darwin,  goarch: arm64 }
          - { name: android-arm64,          goos: android, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - name: Build miragecheck (${{ matrix.name }})
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            GOARM=${{ matrix.goarm }} GOMIPS=${{ matrix.gomips }} \
            go build -trimpath -ldflags "-s -w" \
            -o "miragecheck-${{ matrix.name }}${{ matrix.ext }}" ./cmd/miragecheck
          ls -la miragecheck-${{ matrix.name }}*
      - uses: actions/upload-artifact@v4
        with:
          name: miragecheck-${{ matrix.name }}
          path: miragecheck-${{ matrix.name }}*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - run: ls -la artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/miragecheck-*
